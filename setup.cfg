[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    node_modules,
    frontend/dist,
    artifacts

[tool:pytest]
testpaths = backend/tests tests_local
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
